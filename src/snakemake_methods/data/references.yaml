# Shared reference database, keyed by a short ID (first author + year).
#
# Fields: type (article | inproceedings | book | manual | misc), citation
# (in-text, without parentheses), authors (as written in the reference list;
# et_al: true when truncated), year, title, journal/volume/pages (article),
# booktitle/pages (inproceedings), publisher (other types), doi, pmid, url
# (when there is no DOI), note (appended to the full reference).
#
# Every entry is checked against the publication (Crossref/PubMed for DOIs);
# never add a reference that has not been checked.

