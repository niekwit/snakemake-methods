[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemake-methods"
version = "0.1.0"
description = "Methods section, software versions table and references of a Snakemake run"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Niek Wit" }]
dependencies = ["jinja2>=3.1", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
snakemake-methods = "snakemake_methods.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snakemake_methods = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
